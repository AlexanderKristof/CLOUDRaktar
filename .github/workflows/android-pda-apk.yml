name: Raktar PDA APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-pda-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK építése
        run: gradle -p android assembleRelease --no-daemon

      - name: APK átnevezése
        run: cp android/app/build/outputs/apk/release/app-release.apk RaktarPDA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RaktarPDA-apk
          path: RaktarPDA.apk

      # Közvetlen letöltési link (a PDA böngészőjéből is): Releases -> "Raktar PDA (legujabb)"
      - name: Kiadás frissítése
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pda-latest
          name: Raktar PDA (legujabb)
          body: "Raktar PDA app - build ${{ github.run_number }} (${{ github.sha }})"
          files: RaktarPDA.apk
          make_latest: true
